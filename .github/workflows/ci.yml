name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: pytest + drift-guard (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            v0.3-prelim/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f v0.3-prelim/requirements.txt ]; then
            pip install -r v0.3-prelim/requirements.txt
          fi
          # Install project itself (for module imports)
          pip install -e v0.3-prelim/

      - name: Run pytest (with README-recommended ignores)
        run: |
          python -m pytest v0.3-prelim/tests/ \
            --ignore=v0.3-prelim/tests/test_sparc_hierarchical.py \
            --ignore=v0.3-prelim/tests/test_t32_real_likelihood.py \
            -v --tb=short

      - name: Run drift-guard audit
        run: |
          python scripts/t82_audit.py

  lint:
    name: pre-commit py_compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f v0.3-prelim/requirements.txt ]; then
            pip install -r v0.3-prelim/requirements.txt
          fi

      - name: py_compile all Python source files
        run: |
          # Mirror the project's pre-commit hook (per .githooks/pre-commit):
          # py_compile each .py file under v0.3-prelim/code/ and v0.3-prelim/tests/
          # Fail on any SyntaxError / SyntaxWarning.
          python -c "
          import py_compile, sys, pathlib, warnings
          warnings.simplefilter('error', SyntaxWarning)
          root = pathlib.Path('v0.3-prelim')
          files = list(root.rglob('*.py'))
          errors = 0
          for f in files:
              if '__pycache__' in str(f): continue
              try:
                  py_compile.compile(str(f), doraise=True)
              except (py_compile.PyCompileError, SyntaxWarning) as e:
                  print(f'FAIL: {f}: {e}')
                  errors += 1
          sys.exit(1 if errors else 0)
          "
