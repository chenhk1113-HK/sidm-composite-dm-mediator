name: Self-check

# Per checking plan (docs/CHECKING_PLAN_2026_09_17.md), this runs the
# paper-claims regression tests + audit on every push and PR to the
# active branches. Catches silent drift in the headline numbers
# (Phase 44 +8.10, Phase 53 +7.93, SPARC 115/127, etc.).

on:
  push:
    branches:
      - wip/cloud-9-relhic
      - wip/v19.2-F-init
      - master
  pull_request:
    branches:
      - wip/cloud-9-relhic
      - wip/v19.2-F-init
      - master
  # Manual trigger
  workflow_dispatch:

jobs:
  self-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # 2026-11-03: this job installed bare `pytest`, while
        # test_physical_invariants.py, test_physical_constraints.py and
        # test_independent_and_robustness.py import numpy at module level. The
        # job therefore died during collection (exit 2) rather than reporting a
        # failed assertion; the same file passes 12/12 locally.
        run: pip install -r requirements-ci.txt

      - name: Run paper-claims tests (Layer A + B)
        run: |
          python -m pytest v0.3-prelim/tests/test_paper_claims.py -v --tb=short

      - name: Run physical-invariants tests (Layer C + D + E)
        run: |
          python -m pytest v0.3-prelim/tests/test_physical_invariants.py -v --tb=short

      - name: Run physical-constraints tests (Layer D extended)
        run: |
          python -m pytest v0.3-prelim/tests/test_physical_constraints.py -v --tb=short

      - name: Run independent + robustness tests (Layer D + E)
        run: |
          python -m pytest v0.3-prelim/tests/test_independent_and_robustness.py -v --tb=short

      - name: Run reproducibility + CI wiring guards (Layer G)
        # 2026-11-11. Three guards against drift this repo has actually been bitten by:
        #   - a stochastic artifact published with no seed and no interval
        #     (scripts/seed_interval_audit.py fails closed for artifacts dated 2026-11-11 onward);
        #   - README and CI disagreeing about which Python to use;
        #   - the branch triggers drifting away from the branch that carries this workflow.
        # The tests are stdlib-only on purpose: requirements-ci.txt has no PyYAML, and a guard
        # written with pytest.importorskip("yaml") would skip in CI and assert nothing.
        run: |
          python -m pytest v0.3-prelim/tests/test_repro_contract.py v0.3-prelim/tests/test_ci_workflow_wiring.py -v --tb=short
          python scripts/seed_interval_audit.py

      - name: Run audit_claims.py (Layer F)
        run: |
          python scripts/audit_claims.py

      - name: Upload audit report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-check-failure-logs
          path: |
            v0.3-prelim/tests/
            scripts/
          retention-days: 7
